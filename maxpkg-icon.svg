<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="64" height="64" viewBox="0 0 64 64">
  <title>Height Map Studio - Normal Map Tiles</title>
  <desc>Four raised rounded tiles with cyan, blue, pink and violet normal-map edges on a purple surface.</desc>
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#75f1de"/><stop offset="1" stop-color="#8181ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottom" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#8181ff" stop-opacity="0"/><stop offset="1" stop-color="#8229db"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#3278ea"/><stop offset="1" stop-color="#8181ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#8181ff" stop-opacity="0"/><stop offset="1" stop-color="#ef83d8"/>
    </linearGradient>
    <g id="tile">
      <rect width="22" height="22" rx="4.5" fill="#8181ff"/>
      <path d="M6 0H4.5Q0 0 0 4.5V17.5Q0 22 4.5 22H6Z" fill="url(#left)"/>
      <path d="M16 0H17.5Q22 0 22 4.5V17.5Q22 22 17.5 22H16Z" fill="url(#right)"/>
      <path d="M0 6V4.5Q0 0 4.5 0H17.5Q22 0 22 4.5V6Z" fill="url(#top)"/>
      <path d="M0 16V17.5Q0 22 4.5 22H17.5Q22 22 22 17.5V16Z" fill="url(#bottom)"/>
    </g>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="#8080ff"/>
  <use xlink:href="#tile" x="8" y="8"/>
  <use xlink:href="#tile" x="34" y="8"/>
  <use xlink:href="#tile" x="8" y="34"/>
  <use xlink:href="#tile" x="34" y="34"/>
</svg>
